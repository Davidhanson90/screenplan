name: Refresh snapshot data

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh data
        run: npm run data:refresh
        env:
          SCREENPLAN_DAYS: "5"
          SCREENPLAN_MAX_CINEMAS: "35"
          SCREENPLAN_CONCURRENCY: "2"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh cinema snapshot data"
            git push
          fi
